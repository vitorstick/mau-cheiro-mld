<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123B24"/>
      <stop offset="60%" stop-color="#1E5A38"/>
      <stop offset="100%" stop-color="#2D7A4D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E5A38"/>
      <stop offset="50%" stop-color="#5D2555"/>
      <stop offset="100%" stop-color="#EAF3EC"/>
    </linearGradient>
  </defs>

  <!-- Fundo Principal -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Detalhe Decorativo Fundo -->
  <circle cx="1100" cy="100" r="300" fill="#5D2555" opacity="0.25"/>
  <circle cx="950" cy="550" r="220" fill="#2D7A4D" opacity="0.3"/>

  <!-- Faixa de Cores Municipal no Topo -->
  <rect x="0" y="0" width="1200" height="10" fill="url(#accent)"/>

  <!-- Caixa de Conteúdo Central -->
  <g transform="translate(100, 100)">
    <!-- Badge de Iniciativa -->
    <rect x="0" y="0" width="370" height="42" rx="21" fill="rgba(255, 255, 255, 0.15)"/>
    <circle cx="24" cy="21" r="6" fill="#10B981"/>
    <text x="42" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" letter-spacing="1">INICIATIVA CÍVICA DA MEALHADA</text>

    <!-- Ícone Emblema -->
    <g transform="translate(0, 70)">
      <rect width="90" height="90" rx="22" fill="#2D7A4D" stroke="#EAF3EC" stroke-width="2"/>
      <path d="M45 15C32.6 15 22.5 25.1 22.5 37.5C22.5 52.1 45 73.5 45 73.5C45 73.5 67.5 52.1 67.5 37.5C67.5 25.1 57.4 15 45 15Z" fill="#1E5A38" stroke="#FFFFFF" stroke-width="3"/>
      <circle cx="45" cy="35" r="10" fill="#5D2555"/>
      <path d="M38 58C38 58 41.5 54 45 54C48.5 54 52 58 52 58" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Título Principal -->
    <text x="120" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#FFFFFF">Relato de Odores</text>
    <text x="120" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#A7F3D0">Concelho da Mealhada — Monitorização Ambiental</text>

    <!-- Descrição -->
    <text x="0" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#E2E8F0">
      <tspan x="0" dy="0">Comunicação e reporte rápido de maus cheiros e poluição odorífera.</tspan>
      <tspan x="0" dy="36">Envio direto por email para os serviços competentes da autarquia.</tspan>
    </text>

    <!-- Badges de Recursos -->
    <g transform="translate(0, 350)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="230" height="48" rx="12" fill="rgba(255, 255, 255, 0.12)"/>
      <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF">🔒 100% Anónimo</text>

      <!-- Badge 2 -->
      <rect x="250" y="0" width="220" height="48" rx="12" fill="rgba(255, 255, 255, 0.12)"/>
      <text x="270" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF">⚡ Simples e Rápido</text>

      <!-- Badge 3 -->
      <rect x="490" y="0" width="290" height="48" rx="12" fill="rgba(255, 255, 255, 0.12)"/>
      <text x="510" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF">✉️ Alerta Direto à CM</text>
    </g>
  </g>

  <!-- Barra de Cores Inferior -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#accent)"/>
</svg>
